<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f766e" />
  <title>Mes Repas — planning diabète & courses</title>
  <meta name="description" content="Planning de repas varies et adaptes au diabete, recettes simples, recherche et liste de courses partagee." />
  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" href="./assets/icons/icon-180.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Mes Repas" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A5%97%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="./assets/css/style.css" />
  <script>
    /* Installation PWA — TOUT est ici, dans la page (pas dans les JS qui peuvent
       être en cache). La navigation étant "réseau d'abord", cette page est toujours
       fraîche => le bouton d'installation apparaît dès le prochain rechargement. */
    (function () {
      var deferred = null;
      function dismissed() { try { return localStorage.getItem('repas_install_dismissed') === '1'; } catch (e) { return false; } }
      function showBar() {
        if (!deferred || dismissed()) return;
        var existing = document.getElementById('pwa-install-bar');
        if (existing) { existing.style.display = 'flex'; return; }
        var bar = document.createElement('div');
        bar.id = 'pwa-install-bar';
        bar.style.cssText = 'position:fixed;left:50%;transform:translateX(-50%);top:64px;z-index:9999;background:#1f2a28;color:#fff;border-radius:12px;padding:8px 10px 8px 14px;display:flex;gap:10px;align-items:center;box-shadow:0 8px 26px rgba(0,0,0,.35);font:600 14px -apple-system,BlinkMacSystemFont,system-ui,sans-serif;max-width:94vw';
        var label = document.createElement('span'); label.textContent = '📲 Installer « Mes Repas »';
        var install = document.createElement('button'); install.textContent = 'Installer';
        install.style.cssText = 'background:#0f766e;color:#fff;border:0;border-radius:9px;padding:8px 13px;font-weight:700;cursor:pointer';
        install.onclick = function () { if (!deferred) return; var d = deferred; deferred = null; window.__deferredInstallPrompt = null; bar.style.display = 'none'; try { d.prompt(); } catch (e) {} };
        var close = document.createElement('button'); close.textContent = '✕'; close.setAttribute('aria-label', 'Fermer');
        close.style.cssText = 'background:transparent;color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:9px;padding:8px 11px;cursor:pointer';
        close.onclick = function () { try { localStorage.setItem('repas_install_dismissed', '1'); } catch (e) {} bar.style.display = 'none'; };
        bar.appendChild(label); bar.appendChild(install); bar.appendChild(close);
        (document.body || document.documentElement).appendChild(bar);
      }
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault(); deferred = e; window.__deferredInstallPrompt = e;
        window.dispatchEvent(new Event('repas-installable'));
        if (document.body) showBar(); else window.addEventListener('DOMContentLoaded', showBar);
      });
      window.addEventListener('appinstalled', function () {
        deferred = null; window.__deferredInstallPrompt = null;
        var b = document.getElementById('pwa-install-bar'); if (b) b.style.display = 'none';
        window.dispatchEvent(new Event('repas-installed'));
      });
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () { navigator.serviceWorker.register('./sw.js').catch(function () {}); });
      }
    })();
  </script>
</head>
<body>
  <header class="appbar">
    <button class="appbar__menu" id="btn-menu" aria-label="Menu">☰</button>
    <h1 class="appbar__title">🥗 Mes Repas</h1>
    <button class="appbar__sync" id="theme-toggle" title="Thème clair / sombre">🌙</button>
    <button class="appbar__sync" id="sync-indicator" title="Etat de la synchronisation">⚪</button>
  </header>

  <div class="layout">
    <nav class="nav" id="nav">
      <a href="#/planning" data-route="planning"><span class="nav__ic">📅</span><span class="nav__lb">Planning</span></a>
      <a href="#/recettes" data-route="recettes"><span class="nav__ic">🍽️</span><span class="nav__lb">Recettes</span></a>
      <a href="#/recherche" data-route="recherche"><span class="nav__ic">🔍</span><span class="nav__lb">Recherche</span></a>
      <a href="#/favoris" data-route="favoris"><span class="nav__ic">⭐</span><span class="nav__lb">Favoris</span></a>
      <a href="#/courses" data-route="courses"><span class="nav__ic">🛒</span><span class="nav__lb">Courses</span><span class="nav__badge" id="nav-courses-badge" hidden></span></a>
      <a href="#/reglages" data-route="reglages"><span class="nav__ic">⚙️</span><span class="nav__lb">Réglages</span></a>
    </nav>

    <main class="content" id="view" tabindex="-1">
      <div class="loading">Chargement…</div>
    </main>
  </div>

  <!-- Barre de selection (mode panier) -->
  <div class="selbar" id="selbar" hidden>
    <span id="selbar-count">0 recette sélectionnée</span>
    <div class="selbar__actions">
      <button class="btn btn--ghost" id="selbar-cancel">Annuler</button>
      <button class="btn btn--primary" id="selbar-add">🛒 Ajouter aux courses</button>
    </div>
  </div>

  <!-- Toasts -->
  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script src="./assets/js/config.js"></script>
  <script src="./assets/js/store.js"></script>
  <script src="./assets/js/recipes-plan.js"></script>
  <script src="./assets/js/photos.js"></script>
  <script src="./assets/js/cooking.js"></script>
  <script src="./assets/js/addrecipe.js"></script>
  <script src="./assets/js/ui.js"></script>
  <script src="./assets/js/app.js"></script>
</body>
</html>
